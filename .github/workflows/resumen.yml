name: Resumen en vídeo del directo

# Lo lanza "Publicar directos en el podcast" cuando sale un episodio nuevo.
# A mano: Actions > Resumen en vídeo del directo > Run workflow (vod vacío = el último pendiente).
on:
  workflow_dispatch:
    inputs:
      vod:
        description: "Id del directo de Twitch a resumir (vacío = el último pendiente)"
        type: string
        default: ""
      prueba:
        description: "Solo prueba: se monta pero no se publica en YouTube"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: resumen
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt opencv-python-headless numpy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny
      - name: Material de montaje (rama de trabajo)
        env:
          GH_TOKEN: ${{ github.token }}
          VOD: ${{ inputs.vod }}
          DESDE: "4100"
          HASTA: "11000"
          TROZO: "1380"
          MODELO: small
        run: python material.py
