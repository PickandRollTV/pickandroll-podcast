name: Descargar el logo de la web
on: workflow_dispatch
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p portada
          base=https://pickandroll.tv/wp-content/uploads/2026/10
          {
            date -u
            for f in logo-redondo-pickandroll.webp logo-redondo-pickandroll.png logo-redondo-pickandroll-scaled.webp \
                     logo-redondo-pickandroll-1024x1024.webp logo-redondo-pickandroll-768x768.webp; do
              code=$(curl -sL -A "Mozilla/5.0" -o "portada/$f" -w '%{http_code}' "$base/$f")
              echo "$f -> $code $(stat -c %s "portada/$f" 2>/dev/null)"
              [ "$code" = 200 ] || rm -f "portada/$f"
            done
            curl -sL -A "Mozilla/5.0" https://pickandroll.tv | grep -o 'https://pickandroll.tv/wp-content/uploads/[^" ]*logo[^" ]*' | sort -u
          } > portada/estado.txt
          git config user.name podcast-bot; git config user.email podcast-bot@users.noreply.github.com
          git add portada; git commit -m "Logo de la web"; git pull --rebase origin main; git push
