name: Reorganizar el servidor de Discord

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "probar = solo enseña los cambios; aplicar = los hace; lista-mvp = te manda por privado la lista de MVP; quitar-mvp = quita el rol MVP a los números indicados; avisos = crea los roles de avisos y el menú de entrada; estetica = pone emotes y negrita a canales y categorías; mensajes = publica o actualiza bienvenida, normas y apoyo; moderacion = quita la moderación a MVP y crea Moderador; web = da protagonismo a pickandroll.tv; partidos = abre ya los hilos de los próximos 14 días"
        type: choice
        options: [probar, aplicar, lista-mvp, quitar-mvp, avisos, estetica, mensajes, moderacion, web, partidos]
        default: probar
      numeros:
        description: "Para quitar-mvp: números de la lista de MVP separados por comas (por ejemplo 4,5,12)"
        type: string
        default: ""
      total_mvp:
        description: "Para quitar-mvp: cuántos MVP tenía la lista (si ha cambiado, no se quita nada)"
        type: string
        default: ""
      roles:
        description: "Cambiar también los roles (quitar moderación a MVP y crear Moderador)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: discord-aplicar
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reorganizar
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MODO: ${{ inputs.accion }}
          ACCION: ${{ inputs.accion }}
          ROLES: ${{ inputs.roles && 'si' || 'no' }}
          NUMEROS: ${{ inputs.numeros }}
          TOTAL_MVP: ${{ inputs.total_mvp }}
        run: python discord_aplicar.py
      - name: Guardar el registro de cambios
        if: always()
        run: |
          git config user.name podcast-bot; git config user.email podcast-bot@users.noreply.github.com
          git add auditoria
          [ -f discord_partidos.json ] && git add discord_partidos.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Reorganización del servidor de Discord (${{ inputs.accion }})"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
