name: Top del mes en Discord

on:
  schedule:
    # El día 1 de cada mes a las 10:00 UTC.
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dar el rol a los más activos
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python discord_activos.py
