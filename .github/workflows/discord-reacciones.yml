name: Reaccionar en Discord y avisar de preguntas

on:
  # Lo lanza el bucle de discord-bucle.yml; aquí solo queda para lanzarlo a mano.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-reacciones
  cancel-in-progress: false

jobs:
  reacciones:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reaccionar y avisar
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python discord_reacciones.py
