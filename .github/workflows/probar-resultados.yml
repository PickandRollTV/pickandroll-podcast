name: Probar la búsqueda de resultados
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - > prueba_resultados.txt 2>&1 <<'PY' || true
          import datetime, json
          from presentacion import clean_title
          from resultados import find_score, rival_words
          for v in json.load(open("ultimos_videos.json")):
              t = clean_title(v["titulo"]); m = t.split(" | ")[0]
              start = datetime.datetime.fromisoformat(v["inicio"])
              try: s = find_score(m, start)
              except Exception as e: s = f"ERROR {e}"
              print(v["inicio"][:10], m, rival_words(m), "->", s)
          PY
          git config user.name podcast-bot; git config user.email podcast-bot@users.noreply.github.com
          git add prueba_resultados.txt; git commit -m "Probar resultados"; git pull --rebase origin main; git push
