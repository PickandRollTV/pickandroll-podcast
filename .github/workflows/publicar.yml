name: Publicar directos en el podcast

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos ejecuciones a la vez, para no publicar el mismo directo dos veces.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      # El modelo de voz (Whisper) se descarga una vez y se reutiliza en cada pasada.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Guardar cookies de YouTube (opcional)
        if: env.YT_COOKIES != ''
        run: printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
      - name: Buscar directos terminados y publicarlos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
        run: python podcast.py
      - name: Guardar el feed actualizado
        if: always()
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add episodes.json docs/
          git diff --cached --quiet || (git commit -m "Nuevo episodio del podcast" && git push)

  # GitHub desactiva los cron tras 60 días sin commits; este paso lo evita.
  mantener-activo:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
