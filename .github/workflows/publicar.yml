name: Publicar directos en el podcast

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos ejecuciones a la vez, para no publicar el mismo directo dos veces.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      # El modelo de voz (Whisper) se descarga una vez y se reutiliza en cada pasada.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Buscar directos terminados y publicarlos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python podcast.py
      - name: Guardar el feed actualizado
        if: always()
        run: ./guardar.sh
