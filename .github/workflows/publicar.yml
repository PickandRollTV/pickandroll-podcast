name: Publicar directos en el podcast

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Nunca dos ejecuciones a la vez, para no publicar el mismo directo dos veces.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      # El modelo de voz (Whisper) se descarga una vez y se reutiliza en cada pasada.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Contar episodios antes
        run: echo "ANTES=$(python -c "import json;print(len(json.load(open('episodes.json'))))")" >> "$GITHUB_ENV"
      - name: Buscar directos terminados y publicarlos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python podcast.py
      - name: Guardar el feed actualizado
        if: always()
        run: python guardar.py
      - name: Lanzar el resumen en vídeo si hay episodio nuevo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DESPUES=$(python -c "import json;print(len(json.load(open('episodes.json'))))")
          if [ "$DESPUES" -gt "${ANTES:-$DESPUES}" ]; then gh workflow run resumen.yml --ref main; fi
