name: Publicar directos en el podcast

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos ejecuciones a la vez, para no publicar el mismo directo dos veces.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      # yt-dlp necesita un intérprete de JavaScript para resolver los vídeos de YouTube.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # El modelo de voz (Whisper) se descarga una vez y se reutiliza en cada pasada.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Guardar cookies de YouTube (opcional)
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; fi
      - name: Buscar directos terminados y publicarlos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
        run: python podcast.py
      - name: Guardar el feed actualizado
        if: always()
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add episodes.json ultimos_videos.json docs/
          git add ultimo_error.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar el podcast" && git push)

