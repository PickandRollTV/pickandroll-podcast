name: Importar episodios de Spotify for Creators (una vez)

on:
  workflow_dispatch:
    inputs:
      rss:
        description: "RSS actual de Spotify for Creators (anchor.fm/s/.../podcast/rss)"
        required: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar episodios
        env:
          GH_TOKEN: ${{ github.token }}
          RSS: ${{ inputs.rss }}
        run: python import_spotify.py "$RSS"
      - name: Guardar
        if: always()
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add episodes.json docs/
          git diff --cached --quiet || (git commit -m "Importar episodios de Spotify for Creators" && git push)
