name: Avisar en Discord de los directos de Twitch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-directo
  cancel-in-progress: false

jobs:
  directo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Avisar si empieza un directo
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python discord_directo.py
      - name: Guardar si estamos en directo
        if: always()
        run: |
          [ -f discord_directo.json ] || exit 0
          git config user.name podcast-bot; git config user.email podcast-bot@users.noreply.github.com
          git add discord_directo.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Estado del directo de Twitch"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
